<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>{% block titulo %}Portal SIMULADO{% endblock %} - FOMEZERO</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f4; }
    .faixa { background: #b00020; color: #fff; padding: 8px; text-align: center; font-weight: bold; }
    .topo { background: #1b5e20; color: #fff; padding: 14px 24px; font-size: 20px; }
    main { max-width: 640px; margin: 24px auto; background: #fff; padding: 24px; border-radius: 6px; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input, select { width: 100%; padding: 7px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 10px 18px; background: #1b5e20; color: #fff; border: 0; border-radius: 4px; }
    .erro { color: #b00020; font-weight: bold; }
    #protocolo { font-size: 22px; font-weight: bold; color: #1b5e20; }
  </style>
</head>
<body>
  <div class="faixa">PORTAL SIMULADO — dados fictícios (protótipo FOMEZERO, Global Solution FIAP 2026)</div>
  <div class="topo">Portal do Parceiro (SIMULADO) · Reconhecimento de doadores</div>
  <main>{% block corpo %}{% endblock %}</main>
</body>
</html>
